<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.webmanifest"><title>One Chicago Tracker</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#e5e7eb;background:#0b1020}*{box-sizing:border-box}body{margin:0;padding:20px 16px 100px;max-width:640px;margin-inline:auto}h1{margin:0;font-size:26px}small,.muted{color:#9ca3af}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.sub{margin:8px 0 20px}.panel{background:#172036;border:1px solid #2b3851;border-radius:18px;padding:18px;margin:16px 0}.progress{height:9px;border-radius:10px;background:#354158;overflow:hidden;margin-top:12px}.bar{height:100%;background:#50d6a0;width:0}.next{font-size:20px;font-weight:750;margin:10px 0}.pill{display:inline-block;padding:5px 9px;border-radius:7px;font-size:12px;font-weight:800;color:white}.Fire{background:#b54c31}.PD{background:#365fb5}.Med{background:#168c85}.Justice{background:#8056b4}.SVU{background:#626f87}.episode{display:flex;gap:12px;align-items:center;padding:13px 12px;border-bottom:1px solid #293449}.episode:last-child{border:0}.episode.done{opacity:.54}.episode.done .name{text-decoration:line-through}.info{flex:1;min-width:0}.name{font-weight:650;margin:4px 0;overflow-wrap:anywhere}.eng{font-size:12px;color:#9ca3af}.check{appearance:none;width:27px;height:27px;flex-shrink:0;border:2px solid #77839a;border-radius:50%;cursor:pointer}.check:checked{background:#50d6a0;border-color:#50d6a0}.check:checked:after{content:'✓';display:block;text-align:center;color:#071827;font-weight:900;font-size:19px;line-height:22px}button,select,input[type=search]{font:inherit;border-radius:11px;padding:10px 12px;border:1px solid #45536d;background:#202c44;color:#fff}button{cursor:pointer}.primary{background:#32ba88;color:#061c17;font-weight:750;border:0}.controls{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:16px 0}.controls input{grid-column:1/-1;width:100%}.footer{font-size:12px;color:#9ca3af;margin-top:24px}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.tiny{font-size:12px}.hidden{display:none}#list{padding:0}a{color:#87d8ff}</style></head><body>
<div class="top"><h1>🎬 One Chicago</h1><span class="muted tiny">Watch Tracker</span></div><p class="sub muted">Alle Folgen in deiner chronologischen Reihenfolge</p>
<section class="panel"><div class="row"><strong>Dein Fortschritt</strong><strong id="count">0 / 0</strong></div><div class="progress"><div class="bar" id="bar"></div></div><p id="byshow" class="muted tiny"></p></section>
<section class="panel" id="nextbox"><div class="muted tiny">ALS NÄCHSTES</div><div id="next"></div><button class="primary" id="marknext">Als gesehen markieren ✓</button></section>
<div class="controls"><input type="search" id="search" placeholder="Folge oder Titel suchen …"><select id="show"><option value="">Alle Serien</option><option>Fire</option><option>PD</option><option>Med</option><option>Justice</option><option>SVU</option></select><select id="filter"><option value="all">Alle Folgen</option><option value="open">Nur ungesehene</option><option value="done">Nur gesehene</option></select></div>
<div class="row"><strong>Folgenliste</strong><span id="result" class="muted tiny"></span></div><section class="panel" id="list"></section>
<p class="footer">Deine Markierungen bleiben auf diesem Gerät gespeichert. Für ein Backup kannst du den Fortschritt exportieren und später wieder importieren.</p><div class="row"><button id="export">Backup exportieren</button><button id="importbtn">Backup importieren</button><input id="importfile" class="hidden" type="file" accept="application/json"></div>
<script>
let episodes=[],watched=new Set;const key='one-chicago-watched-v1';try{watched=new Set(JSON.parse(localStorage.getItem(key)||'[]'))}catch{}const $=x=>document.getElementById(x);function save(){localStorage.setItem(key,JSON.stringify([...watched]))}function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}function badge(e){let b=el('span','pill '+(e.show==='Law & Order: SVU'?'SVU':e.show),e.show);return b}function render(){let total=episodes.length,done=episodes.filter(e=>watched.has(e.id)).length;$('count').textContent=done+' / '+total;$('bar').style.width=(total?done/total*100:0)+'%';$('byshow').textContent=['Fire','PD','Med','Justice','SVU'].map(s=>{let a=episodes.filter(e=>e.show===s);return a.length?s+': '+a.filter(e=>watched.has(e.id)).length+'/'+a.length:''}).filter(Boolean).join('  ·  ');let next=episodes.find(e=>!watched.has(e.id));$('next').replaceChildren();$('marknext').disabled=!next;if(next){$('next').append(badge(next),el('div','next',next.de||next.title||'Ohne Titel'),el('div','muted',next.episode+' · '+(next.de?next.title:'')))}else $('next').textContent='Alles gesehen! 🎉';let q=$('search').value.trim().toLowerCase(),show=$('show').value,f=$('filter').value;let arr=episodes.filter(e=>(!show||e.show===show)&&(!q||[e.title,e.de,e.episode,e.show].join(' ').toLowerCase().includes(q))&&(f==='all'||(f==='done')===watched.has(e.id)));$('result').textContent=arr.length+' Folgen';let list=$('list');list.replaceChildren();let frag=document.createDocumentFragment();for(let e of arr){let row=el('div','episode'+(watched.has(e.id)?' done':''));let chk=el('input','check');chk.type='checkbox';chk.checked=watched.has(e.id);chk.setAttribute('aria-label','Gesehen: '+e.show+' '+e.episode);chk.addEventListener('change',()=>{chk.checked?watched.add(e.id):watched.delete(e.id);save();render()});let info=el('div','info');let meta=el('div','');meta.append(badge(e),el('span','muted tiny','  '+e.episode));info.append(meta,el('div','name',e.de||e.title||'Titel unbekannt'));if(e.de&&e.title)info.append(el('div','eng',e.title));row.append(chk,info);frag.append(row)}list.append(frag)}$('marknext').onclick=()=>{let n=episodes.find(e=>!watched.has(e.id));if(n){watched.add(n.id);save();render()}};for(let id of ['search','show','filter'])$(id).addEventListener(id==='search'?'input':'change',render);$('export').onclick=()=>{let blob=new Blob([JSON.stringify({version:1,watched:[...watched]},null,2)],{type:'application/json'});let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='one-chicago-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('importbtn').onclick=()=>$('importfile').click();$('importfile').onchange=async ev=>{try{let d=JSON.parse(await ev.target.files[0].text());if(!Array.isArray(d.watched))throw Error();watched=new Set(d.watched.filter(x=>typeof x==='string'));save();render();alert('Backup importiert')}catch{alert('Ungültige Backup-Datei')}};fetch('episodes.json').then(r=>r.json()).then(d=>{episodes=d;render()}).catch(()=>{$('list').textContent='Folgen konnten nicht geladen werden. Bitte die App über einen Webserver öffnen.'});if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
